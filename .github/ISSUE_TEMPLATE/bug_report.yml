name: 버그 신고
description: 재현 가능한 MCP, 스킬 또는 개발 도구 문제를 보고합니다.
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        이력서 개인정보, 쿠키, 브라우저 프로필과 실제 검색 결과 전체를 입력하지 마세요.

  - type: dropdown
    id: area
    attributes:
      label: 영향 범위
      options:
        - browser-search-core
        - wanted-mcp
        - saramin-mcp
        - jobkorea-mcp
        - job-match-search skill
        - CI 또는 저장소 도구
        - 여러 영역
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 문제 설명
      description: 무엇이 잘못되었는지 간결하게 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      placeholder: |
        1. 실행한 명령 또는 MCP 도구
        2. 개인정보를 제거한 검색 조건
        3. 열린 브라우저에서 보인 상태
        4. 발생한 결과
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 환경
      placeholder: |
        OS와 화면 세션:
        Node:
        pnpm:
        Chrome 버전/실행 경로:
        MCP host:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 정리된 로그
      description: 개인정보, 쿠키, 전체 공고 본문을 제거한 로그만 첨부해 주세요.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: 확인
      options:
        - label: 동일한 Issue가 없는지 검색했습니다.
          required: true
        - label: 개인정보, 쿠키, 브라우저 프로필과 검색 결과 원문을 제거했습니다.
          required: true
        - label: CAPTCHA·로그인·접근 제한이 나타난 경우 자동화를 중단했습니다.
          required: true
