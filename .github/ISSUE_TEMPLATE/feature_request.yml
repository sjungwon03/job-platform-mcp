name: 기능 제안
description: 새로운 브라우저 MCP 도구, 스킬 동작 또는 개발 개선을 제안합니다.
title: "feat: "
labels:
  - enhancement
body:
  - type: dropdown
    id: area
    attributes:
      label: 대상
      options:
        - browser-search-core
        - wanted-mcp
        - saramin-mcp
        - jobkorea-mcp
        - job-match-search skill
        - 개발 경험
        - 문서
        - 새 패키지
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 구현 방법보다 사용자 문제를 먼저 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안
      description: 화면 표시 방식, 검색 조건과 입력·출력 예시를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: browser
    attributes:
      label: 공개 화면 근거
      description: 관련 공식 공개 검색 URL, 화면 요소와 예상되는 구조 변경 위험을 적어 주세요.

  - type: textarea
    id: compliance
    attributes:
      label: 자동화·보안·개인정보 영향
      description: 결과 수, 페이지 이동, 저장, 접근 제한, 이력서 데이터와 약관 영향이 있는지 적어 주세요.
    validations:
      required: true
